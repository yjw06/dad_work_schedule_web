# 부모님 폰에 설치할 안드로이드 APK 만들기
# 앱은 GitHub Pages의 웹 앱을 그대로 띄우는 방식(TWA)이라, 웹을 고치면 APK는 다시 안 만들어도 돼요.
# 결과: Actions → 이 실행 → 아래쪽 Artifacts의 "dad-schedule-apk"
#
# 서명 키를 고정하려면 저장소 Settings → Secrets and variables → Actions 에 아래를 넣으세요.
#   ANDROID_KEYSTORE_BASE64   (keystore 파일을 base64로 바꾼 값)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         (없으면 dadschedule)
# 없으면 빌드할 때마다 임시 키로 서명해요. (그 경우 새 APK로 업데이트하려면 예전 앱을 지우고 설치)
name: 안드로이드 APK 빌드

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            PASS="$KEYSTORE_PASSWORD"
            ALIAS="${KEY_ALIAS:-dadschedule}"
            echo "저장된 서명 키로 서명합니다." >> "$GITHUB_STEP_SUMMARY"
          else
            PASS="temp-$(openssl rand -hex 12)"
            ALIAS="dadschedule"
            keytool -genkeypair -keystore "$KEYSTORE" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Dad Schedule, O=Family, C=KR"
            echo "::warning::저장된 서명 키가 없어 임시 키로 서명했어요. (업데이트하려면 예전 앱을 지우고 설치)"
            echo "⚠️ 임시 키로 서명했어요. 이 APK를 업데이트하려면 예전 앱을 지우고 설치해야 해요." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "::add-mask::$PASS"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"
          FINGERPRINT=$(keytool -list -v -keystore "$KEYSTORE" -alias "$ALIAS" -storepass "$PASS" | sed -n 's/.*SHA256: //p')
          echo "서명 키 SHA-256: \`$FINGERPRINT\`" >> "$GITHUB_STEP_SUMMARY"

      - name: APK 빌드
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 파일 이름 정리
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/dad-schedule.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dad-schedule-apk
          path: dist/dad-schedule.apk
          retention-days: 90
